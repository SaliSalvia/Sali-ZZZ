name: Build Native Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
            build
            app/build
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Generate Gradle Wrapper (if missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Wrapper jar missing — generating..."
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          else
            echo "Wrapper jar present"
          fi
          ls -la gradle/wrapper/

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        timeout-minutes: 30

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        timeout-minutes: 30
        continue-on-error: true  # debug is enough if release fails

      - name: Find APK
        id: find_apk
        run: |
          # Find all APKs
          find . -name "*.apk" -type f
          # Pick release if exists, else debug
          APK=""
          for candidate in \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/debug/app-debug.apk; do
            if [ -f "$candidate" ]; then
              APK="$candidate"
              break
            fi
          done
          if [ -z "$APK" ]; then
            echo "::error::No APK found"
            exit 1
          fi
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK at: $APK"
          # Copy to root for easy access
          cp "$APK" Sali-ZZai.apk
          ls -lh Sali-ZZai.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sali-zzai-apk
          path: Sali-ZZai.apk
          retention-days: 30
          if-no-files-found: error
          compression-level: 9

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Sali-ZZai.apk
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "## 📱 Sali-ZZai Native APK Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f Sali-ZZai.apk ]; then
            echo "✅ **APK built successfully**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Download:** Artifacts → \`sali-zzai-apk\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Size | $(du -h Sali-ZZai.apk | cut -f1) |" >> $GITHUB_STEP_SUMMARY
            echo "| Path | \`${{ steps.find_apk.outputs.path }}\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build failed** — check logs above" >> $GITHUB_STEP_SUMMARY
          fi
